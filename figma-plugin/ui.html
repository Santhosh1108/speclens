<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: Inter, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      color: #12141c;
      font-size: 12px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 4px;
    }
    p {
      color: #5b5f6b;
      line-height: 1.5;
      margin: 0 0 14px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #5b5f6b;
    }
    textarea {
      width: 100%;
      height: 220px;
      box-sizing: border-box;
      border: 1px solid #d7d5cc;
      border-radius: 6px;
      padding: 10px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      resize: vertical;
      margin-bottom: 12px;
    }
    select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d7d5cc;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    button {
      width: 100%;
      background: #12141c;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 11px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      color: #b3261e;
      background: #fbeceb;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      display: none;
      font-size: 11.5px;
    }
    .status {
      color: #1f5c3f;
      background: #e9f5ee;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      display: none;
      font-size: 11.5px;
    }
  </style>
</head>
<body>
  <h1>SpecLens → Figma</h1>
  <p>
    Paste the JSON from SpecLens's "Copy for Figma" button (on the
    prototype screen), then generate real frames and layers.
  </p>

  <div class="error" id="error"></div>
  <div class="status" id="status"></div>

  <label>Prototype JSON</label>
  <textarea id="json" placeholder='{"app_name": "...", "pages": [...], ...}'></textarea>

  <label>Frame width</label>
  <select id="width">
    <option value="1440">Desktop — 1440px</option>
    <option value="768">Tablet — 768px</option>
    <option value="375">Mobile — 375px</option>
  </select>

  <button id="generate">Generate in Figma</button>

  <script>
    const jsonInput = document.getElementById("json");
    const widthInput = document.getElementById("width");
    const button = document.getElementById("generate");
    const errorBox = document.getElementById("error");
    const statusBox = document.getElementById("status");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
      statusBox.style.display = "none";
    }

    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.style.display = "block";
      errorBox.style.display = "none";
    }

    button.addEventListener("click", () => {
      errorBox.style.display = "none";
      statusBox.style.display = "none";

      let data;
      try {
        data = JSON.parse(jsonInput.value);
      } catch (e) {
        showError("That doesn't look like valid JSON. Paste the exact output from SpecLens's \"Copy for Figma\" button.");
        return;
      }

      if (!data || !Array.isArray(data.pages) || data.pages.length === 0) {
        showError("This JSON doesn't have a \"pages\" array. Make sure you copied the prototype JSON, not the PRD.");
        return;
      }

      button.disabled = true;
      button.textContent = "Generating...";

      parent.postMessage(
        {
          pluginMessage: {
            type: "generate",
            data,
            frameWidth: parseInt(widthInput.value, 10),
          },
        },
        "*"
      );
    });

    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;

      button.disabled = false;
      button.textContent = "Generate in Figma";

      if (message.type === "success") {
        showStatus("Done — " + message.pageCount + " page(s) added to the canvas.");
      } else if (message.type === "error") {
        showError(message.message || "Something went wrong generating the frames.");
      }
    };
  </script>
</body>
</html>
